<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input,
        select {
            padding: 10px;
            margin: 5px;
            width: 28%;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .delete {
            background: red;
        }

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-box {
            flex: 1;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .summary-box h3 {
            margin: 0;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            input,
            select,
            button {
                width: 100%;
                margin: 5px 0;
            }

            .summary {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Expense Tracker</h1>
    <p>Full Stack Development Project</p>
</header>

<div class="container">

    <div class="summary">

        <div class="summary-box">
            <h3>Total Expenses</h3>
            <div class="amount" id="totalAmount">₹0</div>
        </div>

        <div class="summary-box">
            <h3>Total Records</h3>
            <div class="amount" id="totalRecords">0</div>
        </div>

    </div>

    <div class="card">

        <h2>Add Expense</h2>

        <input
            type="text"
            id="description"
            placeholder="Expense Description"
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >

        <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
        </select>

        <button onclick="addExpense()">
            Add Expense
        </button>

    </div>

    <div class="card">

        <h2>Search Expense</h2>

        <input
            type="text"
            id="search"
            placeholder="Search expense..."
            onkeyup="searchExpense()"
        >

    </div>

    <div class="card">

        <h2>Expense Details</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseTable"></tbody>

        </table>

    </div>

</div>

<script>

    let expenses =
        JSON.parse(localStorage.getItem("expenses")) || [];

    displayExpenses(expenses);

    function addExpense() {

        let description =
            document.getElementById("description").value.trim();

        let amount =
            Number(document.getElementById("amount").value);

        let category =
            document.getElementById("category").value;

        if (
            description === "" ||
            amount <= 0 ||
            category === ""
        ) {
            alert("Please enter valid expense details");
            return;
        }

        let expense = {
            description: description,
            amount: amount,
            category: category
        };

        expenses.push(expense);

        localStorage.setItem(
            "expenses",
            JSON.stringify(expenses)
        );

        document.getElementById("description").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("category").value = "";

        displayExpenses(expenses);
    }

    function displayExpenses(list) {

        let table =
            document.getElementById("expenseTable");

        table.innerHTML = "";

        list.forEach(function(expense, index) {

            let row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${expense.description}</td>
                <td>₹${expense.amount}</td>
                <td>${expense.category}</td>
                <td>
                    <button
                        class="delete"
                        onclick="deleteExpense(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

        let total = list.reduce(
            (sum, expense) => sum + expense.amount,
            0
        );

        document.getElementById("totalAmount").innerText =
            "₹" + total;

        document.getElementById("totalRecords").innerText =
            list.length;
    }

    function deleteExpense(index) {

        expenses.splice(index, 1);

        localStorage.setItem(
            "expenses",
            JSON.stringify(expenses)
        );

        displayExpenses(expenses);
    }

    function searchExpense() {

        let text =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filtered =
            expenses.filter(function(expense) {

                return (
                    expense.description
                        .toLowerCase()
                        .includes(text) ||

                    expense.category
                        .toLowerCase()
                        .includes(text)
                );
            });

        displayExpenses(filtered);
    }

</script>

</body>
</html>
